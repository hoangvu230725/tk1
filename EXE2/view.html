<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết người dùng</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f8f8f8;
    margin: 0;
    padding: 0;
    text-align: center;
}

.container {
    width: 70%;
    margin: 20px auto;
    background: white;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    padding: 20px;
}

header {
    padding: 10px;
}

.url-bar {
    width: 90%;
    padding: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
    margin-top: 5px;
    text-align: center;
}

nav {
    margin: 15px 0;
}

nav a {
    text-decoration: none;
    color: blue;
    font-weight: bold;
}

.detail-box {
    width: 50%;
    margin: 20px auto;
    padding: 20px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h2 {
    margin-bottom: 20px;
}

p {
    font-size: 16px;
    margin: 10px 0;
}

.edit-button {
    padding: 10px 15px;
    border: none;
    background-color: blue;
    color: white;
    font-size: 14px;
    cursor: pointer;
    border-radius: 5px;
}

.edit-button:hover {
    background-color: darkblue;
}

footer {
    margin-top: 20px;
    padding: 10px;
    background: #f4f4f4;
    font-size: 14px;
}

</style>
<body>

    <div class="container">
        <header>
            <h1>Lập trình web</h1>
            <input type="text" class="url-bar" value="http://php.local" readonly>
        </header>

        <nav>
            <a href="#">Home</a> | 
            <a href="#">Đăng xuất</a>
        </nav>

        <main>
            <div class="detail-box">
                <h2>Màn hình chi tiết</h2>
                <p><strong>Username:</strong> test1</p>
                <p><strong>Email:</strong> test1@gmail.com</p>
                <button class="edit-button">Chỉnh sửa</button>
            </div>
        </main>

        <footer>
            <p>Lập trình web @2024</p>
        </footer>
    </div>

</body>
</html>
